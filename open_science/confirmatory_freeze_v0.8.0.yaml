freeze:
  name: SeismicShield-RL Confirmatory Numerical Freeze
  version: v0.8.0
  status: preregistration_infrastructure_only
  amendment_note: ground_motion_source_amended_to_esm_before_registration
ground_motions:
  esm_contract:
    canonical_source: ESM
    discovery_service: ESM_Dataset_Selection
    authoritative_record_service: ESM_Event_Data
    catalog: ESM
    canonical_event_id: Event_Data_ASCII_EVENT_ID_matching_Dataset_Selection_event_id
    canonical_record_id: exact_source_distributed_ESM_ASCII_basename
    eligible_accelerometric_families: [HN, HG, HL]
    eligible_horizontal_axis_suffixes: [E, N, 1, 2, X, Y]
    rejected_vertical_axis_suffixes: [Z]
    stream_family_must_match_requested_instrument_family: true
    data_type: ACC
    authoritative_units: cm/s^2
    event_time_authority: Event_Data_ASCII_EVENT_DATE_YYYYMMDD_plus_EVENT_TIME_HHMMSS
    standard_gravity_m_s2: 9.80665
    pga_validation_source: max_abs_parsed_acceleration_samples
    pga_validation_tolerance_cm_s2: 0.01
    parsed_sample_count_must_equal_ndata: true
    duration_authority: DURATION_S_if_present_else_fallback
    duration_fallback: "(NDATA - 1) * SAMPLING_INTERVAL_S"
    duration_fallback_requires: [ndata_at_least_2, finite_positive_sampling_interval, parsed_sample_count_equals_ndata]
    provenance_required_headers: [EVENT_ID, STATION_CODE, DATA_LICENSE, DATA_CITATION]
    source_quality_class_is_eligibility_filter: false
    source_processing_type_is_eligibility_filter: false
    raw_waveform_public_redistribution_default: false
    raw_redistribution_requires_explicit_license_permission: true
  physical_events: 40
  records_per_event: 4
  total_records: 160
  partitions:
    training: {events: 18, records: 72}
    validation: {events: 6, records: 24}
    pilot: {events: 4, records: 16, excluded_from_confirmatory_inference: true}
    confirmatory: {events: 12, records: 48}
  eligibility:
    physical_event_identity_known: true
    component: horizontal_acceleration
    units_deterministically_convertible_to_si: true
    maximum_sampling_interval_s: 0.020
    minimum_usable_duration_s: 10.0
    minimum_absolute_pga_g: 0.15
    provenance_required: true
  selection:
    algorithm: SHA-256
    salt: SeismicShield-RL-v0.8.0-OSF-2026
    event_key: "SHA-256(salt + ':event:' + source + ':' + event_id)"
    record_key: "SHA-256(salt + ':record:' + source + ':' + event_id + ':' + record_id)"
