<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SeismicShield-RL project hero</title>
  <desc id="desc">A stylized multi-story building with friction dampers, an earthquake waveform, an AI network, and a research shield.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2938"/><stop offset="0.55" stop-color="#081a2a"/><stop offset="1" stop-color="#06131f"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14374a" stop-opacity=".96"/><stop offset="1" stop-color="#0d2534" stop-opacity=".96"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#4ea7b4" stroke-opacity=".10" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="20" y="20" width="1560" height="860" rx="28" fill="none" stroke="#54c6ca" stroke-opacity=".45" stroke-width="2"/>

