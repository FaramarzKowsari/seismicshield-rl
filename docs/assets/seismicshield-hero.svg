    </g>

    <text x="100" y="790" font-size="22" fill="#ffc47a">FINAL INFRASTRUCTURE RELEASE • full confirmatory run deferred</text>
    <text x="100" y="835" font-size="22" fill="#b4cbd3">Research software • reproducibility infrastructure • no seismic-efficacy claim</text>
  </g>

