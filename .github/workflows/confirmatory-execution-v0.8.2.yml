name: Confirmatory Execution v0.8.2

on:
  pull_request:
    paths:
      - "open_science/confirmatory_execution_v0.8.2.yaml"
      - "open_science/confirmatory_analysis_v0.8.2.yaml"
      - "open_science/DEVIATIONS.md"
      - "src/seismicshield_rl/execution_v0_8_2.py"
      - "src/seismicshield_rl/algorithms/execution_v0_8_2.py"
      - "src/seismicshield_rl/confirmatory_analysis_v0_8_2.py"
      - "src/seismicshield_rl/physics/shear_building.py"
      - "scripts/validate_confirmatory_execution_v0_8_2.py"
      - "scripts/validate_confirmatory_analysis_v0_8_2.py"
      - "tests/test_confirmatory_execution_v0_8_2.py"
      - "tests/test_confirmatory_analysis_v0_8_2.py"
      - ".github/workflows/confirmatory-execution-v0.8.2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install public validation stack
        run: python -m pip install -e ".[dev,marl]"
      - name: Run execution and analysis regression tests
        run: |
          python -m pytest \
            tests/test_confirmatory_execution_v0_8_2.py \
            tests/test_confirmatory_analysis_v0_8_2.py -q
      - name: Validate frozen execution and analysis contracts
        run: |
          mkdir -p results/validation
          python scripts/validate_confirmatory_execution_v0_8_2.py \
            --output results/validation/confirmatory_execution_v0.8.2.json
          python scripts/validate_confirmatory_analysis_v0_8_2.py \
            --output results/validation/confirmatory_analysis_v0.8.2.json
      - name: Hash validation evidence
        run: sha256sum results/validation/confirmatory_*_v0.8.2.json
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: confirmatory-v0.8.2-validation
          path: results/validation/confirmatory_*_v0.8.2.json
          if-no-files-found: error
