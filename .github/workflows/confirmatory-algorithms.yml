name: Confirmatory Algorithm Bundle

on:
  pull_request:
    paths:
      - "src/seismicshield_rl/algorithms/**"
      - "scripts/validate_confirmatory_algorithms.py"
      - "open_science/confirmatory_algorithm_bundle_v0.8.1.yaml"
      - "tests/test_confirmatory_algorithm_bundle.py"
      - ".github/workflows/confirmatory-algorithms.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-algorithms:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen CPU validation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.2 PyYAML==6.0.3 pytest==9.1.1
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Show reference runtime
        run: |
          python --version
          python -c "import numpy, torch, yaml; print('numpy', numpy.__version__); print('torch', torch.__version__); print('PyYAML', yaml.__version__)"
      - name: Run algorithm contract tests
        run: python -m pytest -q tests/test_confirmatory_algorithm_bundle.py
      - name: Write algorithm validation evidence
        run: python scripts/validate_confirmatory_algorithms.py --output confirmatory_algorithm_validation_v0.8.1.json
      - name: Upload algorithm validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: confirmatory-algorithm-validation-v0.8.1
          path: confirmatory_algorithm_validation_v0.8.1.json
          if-no-files-found: error
