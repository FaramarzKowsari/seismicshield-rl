name: Confirmatory Runtime Preflight v0.8.2

on:
  pull_request:
    paths:
      - "scripts/hydrate_frozen_esm_manifest_v0_8_2.py"
      - "tests/test_hydrate_frozen_esm_manifest_v0_8_2.py"
      - "open_science/CONFIRMATORY_RUNTIME_RUNBOOK_v0.8.2.md"
      - ".github/workflows/confirmatory-runtime-preflight-v0.8.2.yml"
  push:
    branches: [main]
    paths:
      - "scripts/hydrate_frozen_esm_manifest_v0_8_2.py"
      - "tests/test_hydrate_frozen_esm_manifest_v0_8_2.py"
      - "open_science/CONFIRMATORY_RUNTIME_RUNBOOK_v0.8.2.md"
      - ".github/workflows/confirmatory-runtime-preflight-v0.8.2.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: confirmatory-runtime-preflight-v0.8.2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate hydrator without network access
        run: |
          python -m py_compile scripts/hydrate_frozen_esm_manifest_v0_8_2.py
          python -m pytest tests/test_hydrate_frozen_esm_manifest_v0_8_2.py -q

  pilot-runtime-preflight:
    if: github.event_name == 'push' && github.repository == 'FaramarzKowsari/seismicshield-rl'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate-orchestration
    steps:
      - name: Checkout orchestration utilities from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: orchestrator
          fetch-depth: 1

      - name: Checkout immutable scientific source tag
        uses: actions/checkout@v4
        with:
          ref: confirmatory-v0.8.2-final
          path: frozen
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frozen/pyproject.toml

      - name: Install frozen runtime with OpenSeesPy
        run: python -m pip install -e "./frozen[opensees]"

      - name: Verify immutable tag and confirmatory gate before data hydration
        shell: bash
        run: |
          set -euo pipefail
          cd frozen
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/tags/confirmatory-v0.8.2-final^{commit})"
          python scripts/check_confirmatory_gate.py

      - name: Ephemerally hydrate all 136 frozen ESM records
        run: |
          python orchestrator/scripts/hydrate_frozen_esm_manifest_v0_8_2.py \
            --manifest frozen/data/manifests/ground_motion_manifest.csv \
            --output-dir frozen/data/private/esm/processed-selected-v0.8.1 \
            --audit-out frozen/results/local/confirmatory_v0.8.2/hydration.audit.json

      - name: Run pilot-only Tier-1/Tier-2 runtime preflight
        run: |
          python frozen/scripts/preflight_confirmatory_runtime_v0_8_2.py \
            --private-dir frozen/data/private/esm/processed-selected-v0.8.1 \
            --output frozen/results/local/confirmatory_v0.8.2/preflight.json

      - name: Prove no waveform files enter the artifact set
        shell: bash
        run: |
          set -euo pipefail
          test -f frozen/results/local/confirmatory_v0.8.2/hydration.audit.json
          test -f frozen/results/local/confirmatory_v0.8.2/preflight.json
          if find frozen/results/local/confirmatory_v0.8.2 -type f \( -name '*.csv' -o -name '*.zip' -o -name '*.asc' \) | grep -q .; then
            echo "Waveform-like file found in evidence directory" >&2
            exit 2
          fi

      - name: Hash non-waveform preflight evidence
        run: sha256sum frozen/results/local/confirmatory_v0.8.2/*.json

      - name: Upload preflight evidence only
        uses: actions/upload-artifact@v4
        with:
          name: confirmatory-runtime-preflight-v0.8.2
          path: frozen/results/local/confirmatory_v0.8.2/*.json
          if-no-files-found: error
          retention-days: 90

  report-status:
    if: always() && github.event_name == 'push' && github.repository == 'FaramarzKowsari/seismicshield-rl'
    runs-on: ubuntu-latest
    needs: [validate-orchestration, pilot-runtime-preflight]
    steps:
      - name: Publish machine-readable run pointer to a stable issue
        uses: actions/github-script@v7
        env:
          VALIDATION_RESULT: ${{ needs.validate-orchestration.result }}
          PREFLIGHT_RESULT: ${{ needs.pilot-runtime-preflight.result }}
        with:
          script: |
            const title = 'Confirmatory Runtime Preflight v0.8.2 status';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### Confirmatory runtime preflight v0.8.2',
              '',
              `- validation: **${process.env.VALIDATION_RESULT}**`,
              `- pilot runtime preflight: **${process.env.PREFLIGHT_RESULT}**`,
              `- workflow run: ${runUrl}`,
              `- source commit: \`${context.sha}\``,
              '- immutable scientific source: `confirmatory-v0.8.2-final`',
              '- confirmatory structural-response outcomes inspected by this workflow: **no**',
              '- waveform files uploaded as artifacts: **no**',
              '',
              `Recorded at ${new Date().toISOString()}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(
              issue => !issue.pull_request && issue.title === title
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [],
              });
            }
