[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seismicshield-rl"
version = "0.8.3"
description = "Preregistered, reproducible research software for auditable reinforcement-learning benchmarking in seismic friction-damper co-design"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Faramarz Kowsari"}]
keywords = [
  "seismic engineering",
  "reinforcement learning",
  "multi-agent reinforcement learning",
  "multi-objective optimization",
  "friction dampers",
  "OpenSeesPy",
  "reproducible research",
  "preregistration",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://faramarzkowsari.github.io/seismicshield-rl/"
Repository = "https://github.com/FaramarzKowsari/seismicshield-rl"
Documentation = "https://faramarzkowsari.github.io/seismicshield-rl/researcher-guide.html"
Issues = "https://github.com/FaramarzKowsari/seismicshield-rl/issues"
"SoftwareX v0.8.3 archive" = "https://doi.org/10.5281/zenodo.22144346"
"Archived scientific release" = "https://doi.org/10.5281/zenodo.22067278"
"Software concept DOI" = "https://doi.org/10.5281/zenodo.22067277"
"OSF preregistration" = "https://doi.org/10.17605/OSF.IO/64DTX"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
marl = ["torch>=2.3", "torchrl>=0.6", "gymnasium>=1.0", "pettingzoo>=1.24"]
optim = ["pymoo>=0.6"]
opensees = ["openseespy==3.8.0.0; python_version >= '3.12'"]
tadas = ["playwright>=1.45,<2"]
all = ["seismicshield-rl[dev,api,marl,optim,opensees,tadas]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
